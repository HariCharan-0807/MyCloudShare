<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudShare | Secure Cloud Storage</title>
    <meta name="description" content="CloudShare — upload, preview, and manage your files securely from anywhere.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="login-screen" class="login-wrapper">
        <!-- Floating cloud decorations -->
        <div class="floating-cloud cloud-1">☁️</div>
        <div class="floating-cloud cloud-2">☁️</div>
        <div class="floating-cloud cloud-3">⛅</div>
        <div class="floating-cloud cloud-4">☁️</div>

        <div class="login-card">
            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="fas fa-cloud-arrow-up"></i>
                </div>
                <h1 class="brand-title">CloudShare</h1>
                <p class="brand-tagline">Your files, anywhere, anytime.</p>
            </div>

            <!-- Tab Toggle -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
                <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Test Account Notice -->
            <div id="test-account-notice" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px; margin-bottom: 1rem; text-align: center; font-size: 0.85rem; color: rgba(255, 255, 255, 0.8);">
                <i class="fas fa-info-circle"></i> Hit a sign up limit? Use our test account:<br>
                <b>test@test.com</b> / <b>password</b>
            </div>

            <!-- Form -->
            <div class="login-form">
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                </div>

                <button id="login-btn" class="login-btn" onclick="handleLogin()">
                    <span id="btn-text">Sign In</span>
                    <i class="fas fa-arrow-right" id="btn-arrow"></i>
                    <i class="fas fa-spinner fa-spin" id="btn-spinner" style="display:none;"></i>
                </button>

                <p id="login-msg"></p>
            </div>
        </div>
    </div>

    <!-- ===== APP SCREEN ===== -->
    <div id="app-screen" class="app-wrapper hidden">
        <!-- Floating cloud decorations (same style) -->
        <div class="floating-cloud cloud-1">☁️</div>
        <div class="floating-cloud cloud-2">☁️</div>
        <div class="floating-cloud cloud-3">⛅</div>
        <div class="floating-cloud cloud-4">☁️</div>

        <div class="app-card">
            <!-- Header -->
            <div class="app-header">
                <div class="app-header-left">
                    <div class="header-icon">
                        <i class="fas fa-cloud-arrow-up"></i>
                    </div>
                    <div>
                        <h2 class="app-title">My Cloud</h2>
                        <p class="app-subtitle" id="user-email"></p>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fas fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>

            <!-- Upload Zone -->
            <div class="upload-zone" id="drop-zone">
                <input type="file" id="fileInput">
                <div class="upload-content">
                    <div class="upload-icon-circle">
                        <i class="fas fa-cloud-arrow-up"></i>
                    </div>
                    <p class="upload-text">Drag & Drop files here</p>
                    <p class="upload-subtext">or <span class="upload-link">click to browse</span></p>
                </div>
                <p id="upload-status"></p>
            </div>

            <!-- File List -->
            <div class="files-section">
                <h3 class="section-title">
                    <i class="fas fa-clock-rotate-left"></i>
                    <span>Recent Uploads</span>
                </h3>
                <div id="file-list" class="file-list"></div>
            </div>
        </div>
    </div>

    <!-- ===== LIGHTBOX ===== -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Preview" style="display:none;">
        <iframe id="lightbox-frame" src="" style="display:none; width:80%; height:80%; border:none; background:white; border-radius:12px;"></iframe>
    </div>

    <script src="logic.js"></script>
</body>
</html>
